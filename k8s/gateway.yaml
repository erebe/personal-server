apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: custom-proxy-config
  addresses:
   - type: IPAddress
     value: 2a01:4f8:c013:7b8::1
   - type: IPAddress
     value: 49.13.58.9
  listeners:
    # Plain TCP (not TLS/Passthrough): Envoy Gateway only attaches the
    # tls_inspector listener filter when it has to match on SNI or a TLS
    # fingerprint, so this listener gets a bare tcp_proxy filter chain that
    # never waits for client bytes. That is what makes SMTP's server-first
    # 220 banner work here while it would deadlock behind TLS passthrough.
    - name: smtp25-listener
      protocol: TCP
      port: 25
      allowedRoutes:
        kinds:
          - kind: TCPRoute
            group: gateway.networking.k8s.io
        namespaces:
          from: All
    - name: smtp587-listener
      protocol: TCP
      port: 587
      allowedRoutes:
        kinds:
          - kind: TCPRoute
            group: gateway.networking.k8s.io
        namespaces:
          from: All
    - name: smtp465-listener
      protocol: TCP
      port: 465
      allowedRoutes:
        kinds:
          - kind: TCPRoute
            group: gateway.networking.k8s.io
        namespaces:
          from: All
    - name: imaps-listener
      protocol: TCP
      port: 993
      allowedRoutes:
        kinds:
          - kind: TCPRoute
            group: gateway.networking.k8s.io
        namespaces:
          from: All
    - name: http
      protocol: HTTP
      port: 80
      # Only HTTPRoutes from the dedicated https-redirect namespace may bind here.
      # allowedRoutes can filter by namespace and kind only, never by route name,
      # so isolating the redirect in its own namespace is what makes it exclusive.
      # Without this, every service HTTPRoute in `default` also binds to :80 and
      # wins precedence on its own hostname, so the redirect never fires.
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              # Applied automatically to every namespace by the apiserver.
              kubernetes.io/metadata.name: https-redirect
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
        - kind: Secret
          name: erebe-eu-tls
          namespace: default
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: custom-proxy-config
  namespace: default
spec:
  ipFamily: DualStack
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: envoy-http
        allocateLoadBalancerNodePorts: false
        patch:
          type: StrategicMerge
          value:
            spec:
              clusterIp: 10.43.0.11
              clusterIps:
              - 10.43.0.11
              - fd02::b
        #type: NodePort
        externalTrafficPolicy: Local
      envoyDeployment:
        pod:
          tolerations:
            - key: "kubernetes.io/hostname"
              operator: "Equal"
              value: "server"

---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: response-compression
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy
  http3: {}
  # https-erebe-eu and https-erebe-dev share the erebe-eu-tls cert, so their SANs
  # overlap and EG would drop ALPN to http/1.1 on the TCP chains (GEP-3567).
  # Setting ALPN explicitly suppresses that downgrade. Does not touch HTTP/3:
  # the QUIC transport socket hardcodes ALPN "h3".
  tls:
    alpnProtocols:
      - h2
      - http/1.1
#  proxyProtocol:
#    optional: true
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: response-compression
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy
  compressor:
    - type: Zstd
      zstd: {}
    - type: Brotli
      brotli: {}
    - type: Gzip
      gzip: {}
---
apiVersion: v1
kind: Namespace
metadata:
  name: https-redirect
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: https-redirect
spec:
  parentRefs:
    - name: envoy
      namespace: default
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
