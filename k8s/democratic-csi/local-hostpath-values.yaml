# democratic-csi, second instance: plain directories on scw's ZFS mirror
# `zdata` (nvme0n1p4 + nvme1n1p5), mounted at /mnt/zdata.
#
# This exists so the write-heavy observability volumes (Prometheus TSDB, Loki
# chunks) stay on the node instead of crossing WireGuard to iSCSI on
# 10.200.0.7. k3s's bundled local-storage is disabled cluster-wide
# (nodes/k3s/k3s/config.yaml) and cannot simply be re-enabled: k3s marks its
# local-path class as default and nfs-nvme already holds that role, which would
# leave two defaults and make karakeep's unqualified PVCs ambiguous.
#
# These volumes used to sit on /var/lib/csi-local-hostpath, i.e. scw's 200G
# ext4 root on md1. The reason to move them is checksums, not space: ZFS
# checksums every block and a mirror can rebuild a bad one from the other leg,
# where md1 can only notice that its two legs disagree and cannot say which
# one is right. Do not expect much from compression=on - Prometheus already
# packs its TSDB blocks and Loki gzips its chunks, so lz4 mostly early-aborts
# on both; it earns its keep on Grafana's sqlite and costs nothing on the rest.
# Still node-local in the sense that matters for scheduling: these are one
# machine's directories, served by that machine, and a pod that cannot land on
# scw cannot use them. What is no longer true is that nothing leaves the node -
# sanoid snapshots zdata hourly and proxmox pulls those snapshots into
# backup/scw-backup every night (nodes/scw/sanoid/sanoid.conf,
# nodes/proxmox/sanoid/syncoid-scw.*). Losing scw now costs availability and up
# to a day of writes, not the data.

csiDriver:
  # Must be unique per cluster - the zfs-iscsi release owns
  # org.democratic-csi.iscsi.
  name: "org.democratic-csi.local-hostpath"

  # The driver deliberately does not advertise PUBLISH_UNPUBLISH_VOLUME (it is
  # commented out in src/driver/controller-client-common/index.js:68) - a
  # directory is bind-mounted by the node plugin, never attached by a
  # controller. Left at the chart's default of true, every pod would block
  # forever waiting on a VolumeAttachment that nothing creates.
  attachRequired: false

  # Without this, a pod that does not run as root cannot write to its own
  # volume. kubelet only applies a pod's fsGroup to a CSI volume according to
  # this policy, and the default (ReadWriteOnceWithFSType) requires an fsType -
  # which a bind-mounted directory does not have, so kubelet silently skips the
  # chown and the directory stays root:root 0770. Prometheus (65534) then dies
  # with `open /data/queries.active: permission denied`.
  #
  # `File` makes kubelet apply the ownership regardless of fsType, so each
  # workload's own fsGroup takes the directory - 65534 for Prometheus, 10001
  # for Loki. The driver does not advertise VOLUME_MOUNT_GROUP
  # (controller-client-common/index.js:112), so kubelet does the chown itself
  # rather than handing the group to the driver.
  #
  # NOTE: this field may be immutable on an existing CSIDriver object. If the
  # helm upgrade does not take, delete it and re-run - no volumes are lost:
  #   kubectl delete csidriver org.democratic-csi.local-hostpath
  fsGroupPolicy: File

storageClasses:
    # Named for the pool, not the node: which nodes this class can serve is
    # decided by node.nodeSelector below, and the driver pins each volume to its
    # own node through topology - so a node name in the class name would be a
    # claim the class does not make. Renaming it again is not free, a PVC's
    # storageClassName being immutable, so every claim would have to be
    # recreated; free this once only because the move to /mnt/zdata already
    # requires exactly that.
  - name: local-hostpath-zdata
    defaultClass: false
    reclaimPolicy: Delete
    # The volume is a directory on one specific machine, so binding has to wait
    # until the scheduler has placed the pod: WaitForFirstConsumer is what puts
    # the node in volume.kubernetes.io/selected-node, which is the annotation
    # the node-deployment provisioners use to decide whose PVC this is.
    # Immediate would bind the PV before anything knows where the pod lands.
    volumeBindingMode: WaitForFirstConsumer
    # Directories have no size to grow.
    allowVolumeExpansion: false
    parameters:
      # A bind-mounted directory has no filesystem of its own, so this stays
      # empty - it is only spelled out to keep external-provisioner from
      # logging the "fstype" deprecation warning on every provision. See the
      # note in zfs-iscsi-values.yaml; the key is immutable, so `just csi`
      # needs the class deleted first for a change here to take.
      csi.storage.k8s.io/fstype: ""

driver:
  config:
    driver: local-hostpath
    instance_id: scw
    local-hostpath:
      # These two must be identical, and the path has to be hostPath-mounted
      # into the driver container - see node.extraVolumes below.
      #
      # This is the zdata mountpoint itself, not a subdirectory: the driver
      # appends its own layout, volumes at <basePath>/v/<volume-id> and
      # filecopy snapshots at <basePath>/s/<id>
      # (getVolumeExtraPath/getSnapshotExtraPath,
      # src/driver/controller-client-common/index.js:237).
      #
      # Changing this does not move volumes that already exist: CreateVolume
      # writes the absolute path into the PV's volumeAttributes.path
      # (controller-local-hostpath/index.js:51) and the node plugin bind-mounts
      # that stored value, so old PVs keep pointing at
      # /var/lib/csi-local-hostpath/v/<id>. Their directories have to be moved
      # under /mnt/zdata/v/ and the PVs recreated, or the data is stranded.
      shareBasePath: "/mnt/zdata"
      controllerBasePath: "/mnt/zdata"
      dirPermissionsMode: "0770"
      dirPermissionsUser: 0
      dirPermissionsGroup: 0
      snapshots:
        # rsync/cp into a sibling directory on the same pool. Enough for a
        # clone and nothing beyond it: a copy that shares the disks it protects
        # is not a backup. The thing that does leave the machine is the ZFS
        # snapshot stream proxmox pulls out of zdata - see the header.
        default_driver: filecopy

# For a local driver the component that creates the directory must run on the
# machine that owns it, so the controller sidecars ride along on the node
# DaemonSet rather than sitting in their own Deployment.
controller:
  enabled: true
  strategy: node

  externalProvisioner:
    # Distributed provisioning. This is what makes the release safe to run on
    # more than one node, and it is not the chart's default.
    #
    # The chart's default args carry `--leader-election`, which is actively
    # wrong for a node-local driver: with N DaemonSet pods, exactly one
    # provisioner wins the lease, every CreateVolume in the cluster lands on
    # that pod, and the driver both mkdirs on its *own* disk and stamps the PV
    # with its own node -
    #
    #   async getAccessibleTopology() {
    #     const response = await super.NodeGetInfo(...arguments);
    #     return [{ segments: { [NODE_TOPOLOGY_KEY_NAME]: response.node_id } }];
    #   }
    #
    # (controller-local-hostpath/index.js, NODE_TOPOLOGY_KEY_NAME is
    # "org.democratic-csi.topology/node"). So the volume would be created on
    # the lease holder while the scheduler had already picked somewhere else,
    # and the PV's nodeAffinity would drag the pod to the lease holder or leave
    # it unschedulable. Worse, it moves: new volumes follow the lease after any
    # restart. With a single-node DaemonSet the lease holder is the only node
    # and none of this is visible, which is exactly why it would go unnoticed
    # until the day the selector below is widened.
    #
    # --node-deployment drops leader election and has each provisioner handle
    # only the PVCs whose selected node is its own, read from the
    # volume.kubernetes.io/selected-node annotation. It requires the node name
    # in NODE_NAME or it refuses to start:
    #   F csi-provisioner.go:147] The NODE_NAME environment variable must be
    #   set when using --enable-node-deployment
    # The chart's provisioner container already supplies it from
    # spec.nodeName via the downward API, so there is nothing to add here.
    #
    # --strict-topology passes only the selected node's topology to
    # CreateVolume instead of every node's, and --immediate-topology=false
    # stops it advertising an aggregate cluster topology that no single
    # directory can satisfy.
    #
    # --node-deployment-immediate-binding=false is not strictly required (the
    # class below is WaitForFirstConsumer, so binding is always late) but it
    # closes the door on the one mode that cannot work here: with immediate
    # binding, every node's provisioner races on a 20s-1m random delay to claim
    # the PVC, and the winner decides which machine the data lives on with no
    # relation to where the pod will run. A Pending PVC is the better failure.
    #
    # Everything else is the chart's default list, restated because `args`
    # replaces it wholesale - `extraArgs` only appends, and appending cannot
    # remove --leader-election.
    args:
      - --v={{ .Values.controller.externalProvisioner.verbosityLevel }}
      - --node-deployment
      - --strict-topology
      - --immediate-topology=false
      - --node-deployment-immediate-binding=false
      - --timeout=90s
      - --worker-threads=10
      - --extra-create-metadata
      - --csi-address={{ .csiSocketAddress }}

  # Nothing to attach - see csiDriver.attachRequired.
  externalAttacher:
    enabled: false

  # This cluster has no VolumeSnapshot CRDs and no snapshot-controller, so the
  # snapshotter sidecar cannot do anything except log a watch failure forever:
  #   Failed to watch *v1.VolumeSnapshotClass: the server could not find the
  #   requested resource (get volumesnapshotclasses.snapshot.storage.k8s.io)
  # Re-enable it alongside the CRDs if VolumeSnapshots are ever wanted.
  externalSnapshotter:
    enabled: false

  # A directory has no size to grow, and the storage class sets
  # allowVolumeExpansion: false - so the resizer has nothing to resize.
  externalResizer:
    enabled: false

node:
  # All three are chart defaults, and all three exist for the *other* release.
  # node.yaml annotates them `Required by iSCSI` (hostNetwork) and
  # `Required by multipath detach` (hostIPC): iscsid and multipathd live on the
  # host and are reached through its network and IPC namespaces. This driver
  # bind-mounts a local directory and talks to nothing, so inheriting them put a
  # storage DaemonSet on scw's host network and in its host IPC namespace for no
  # reason at all.
  #
  # Nothing here needs either: the CSI socket, the kubelet registration socket
  # and the volume paths are all hostPath mounts, mounting works through
  # Bidirectional propagation rather than nsenter (hence hostPID stays false),
  # and the external-provisioner sidecar reaches the API server over the pod
  # network like every other pod - by KUBERNETES_SERVICE_HOST, so it does not
  # even need DNS.
  #
  # dnsPolicy follows: ClusterFirstWithHostNet is only meaningful with
  # hostNetwork, and leaving it behind would be a claim about this pod that is
  # no longer true.
  hostNetwork: false
  hostIPC: false
  dnsPolicy: ClusterFirst

  # scw only, for now - and with distributed provisioning above, this is now a
  # policy choice rather than a correctness requirement. It is the single gate
  # on which nodes offer local storage.
  #
  # To add a node, three things have to line up, and the third is the one that
  # bites: the selector has to match it, its taint has to be tolerated (every
  # node in this cluster carries kubernetes.io/hostname=<name>:NoSchedule), and
  # it has to have something mounted at the base path below. That path is a
  # single value shared by every pod in the DaemonSet, so it is a promise each
  # node has to keep. `type: Directory` is what turns a node that cannot keep it
  # into a FailedMount instead of a directory quietly created on its root disk.
  #
  # Deliberately not `tolerations: [{operator: Exists}]`, tempting as it is for
  # a DaemonSet: a storage driver that provisions host directories should land
  # on nodes someone chose, not on whatever the cluster grows next.
  nodeSelector:
    kubernetes.io/hostname: scw
  tolerations:
    - key: kubernetes.io/hostname
      operator: Equal
      value: scw
      effect: NoSchedule

  driver:
    extraVolumeMounts:
      - name: local-hostpath
        mountPath: /mnt/zdata

  extraVolumes:
    - name: local-hostpath
      hostPath:
        path: /mnt/zdata
        # Directory, not DirectoryOrCreate: /mnt/zdata is a ZFS mountpoint, and
        # DirectoryOrCreate lets kubelet mkdir it on the root fs when the pool
        # is not imported. The driver then provisions happily into md1 - no
        # mirror, no checksums, no compression - and nothing reports an error
        # until the pool comes back and hides the stale files under the
        # mountpoint. Directory makes kubelet refuse the mount instead, so the
        # DaemonSet pod sits in ContainerCreating with a FailedMount event:
        #   hostPath type check failed: /mnt/zdata is not a directory
        #
        # This only catches a missing /mnt/zdata. If the pool is exported but the
        # mountpoint directory it left behind is still there, kubelet cannot
        # tell the difference and neither can this field - `zfs mount zdata`
        # before trusting the volumes.
        type: Directory
