# scw. One pool, one dataset: zdata, the 1.66T mirror behind the
# democratic-csi local-hostpath class - Prometheus' TSDB, Loki's chunks and
# Grafana's sqlite (k8s/democratic-csi/local-hostpath-values.yaml).
#
# That driver provisions plain *directories* under /mnt/zdata/v/<volume-id>,
# not datasets, so every PVC on this node lives inside this single dataset and
# one snapshot captures all of them at the same instant. Worth knowing before
# reading `recursive` below as protection: there is nothing under zdata to
# recurse into.
#
# None of this is application-consistent, and it does not need to be: a
# snapshot of a running Prometheus is byte-for-byte what a power cut would have
# left, which is the case its WAL exists to replay.
#
# Snapshot names are UTC - the packaged sanoid.service sets Environment=TZ=UTC -
# so the daily is taken at 00:00 UTC, 02:00 CEST. proxmox pulls at 03:00 local
# for that reason; see nodes/proxmox/sanoid/syncoid-scw.timer.
[zdata]
	use_template = production
	# Nothing to recurse into today (see above). Left on so that a child
	# dataset created later is covered the day it appears rather than the day
	# someone notices it never was.
	recursive = yes

# Deliberately the same numbers as template_production in
# nodes/proxmox/sanoid/sanoid.conf - "like production" is the whole
# specification. The block is repeated rather than shared because sanoid.conf
# cannot include another file.
#
# Allow to go back
# hourly 36 -> 1,5 days ago at 1 hour granularity
# daily 7 -> 7 days at the day granularity
#
# The replica on proxmox (backup/scw-backup) keeps 90 dailies and prunes every
# hourly it receives, so those 36 hourlies exist only here. Lose this pool and
# the finest granularity that survives is a day - which the daily pull already
# implies, since up to a day of writes was never sent.
#
# The 7 dailies are also the width of the replication window: syncoid picks the
# newest snapshot common to both sides as its incremental base, and after
# proxmox has pruned the hourlies that base is a daily. A pull that fails for
# more than a week outlives every daily the target has, and the only way back
# is a full send.
[template_production]
	frequently = 0
	hourly = 36
	daily = 7
	weekly = 0
	monthly = 0
	yearly = 0
	autosnap = yes
	autoprune = yes
