# scw: one pool, one dataset. zdata is the mirror behind the democratic-csi
# local-hostpath class - Prometheus' TSDB, Loki's chunks, Grafana's sqlite.
#
# That driver makes plain directories under /mnt/zdata/v/, not datasets, so
# every PVC here lives in this single dataset and one snapshot covers them all
# at the same instant. Nothing to recurse into today; `recursive` is for the day
# a child dataset appears.
#
# Snapshot names are UTC (sanoid.service sets TZ=UTC), so the daily is taken at
# 02:00 local - hence proxmox pulling at 03:00.
[zdata]
	use_template = production
	recursive = yes

# Same numbers as template_production in nodes/proxmox/sanoid/sanoid.conf;
# repeated because sanoid.conf cannot include another file.
#
# hourly 36 -> 1,5 days at hour granularity
# daily 7 -> a week at day granularity
#
# The replica (backup/scw-backup) keeps 90 dailies and prunes every hourly it
# receives, so these 36 exist only here. The 7 dailies are also the width of the
# replication window: syncoid resumes from the newest common snapshot, which
# after the target's pruning is a daily, so a pull broken for over a week needs
# a full send.
[template_production]
	frequently = 0
	hourly = 36
	daily = 7
	weekly = 0
	monthly = 0
	yearly = 0
	autosnap = yes
	autoprune = yes
