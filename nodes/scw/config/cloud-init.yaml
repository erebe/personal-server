#cloud-config

# Do not create the distro default user (debian/ubuntu/...), so uid 1000 stays free.
users:
  - name: erebe
    uid: 1000
    primary_group: erebe
    groups: [users, adm, sudo, systemd-journal]
    shell: /bin/bash
    lock_passwd: true
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - "ssh-rsa  openpgp:0xDBA17AD7"

# root has no usable password and its authorized_keys gets the "disabled" banner
disable_root: true
ssh_pwauth: false

write_files:
  - path: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root:root
    permissions: "0644"
    content: |
      PermitRootLogin no
      PubkeyAuthentication yes
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitEmptyPasswords no

