---
- name: Configure proxmox node
  hosts: proxmox
  # connects as root already (per inventory) — no sudo needed
  become: false
  vars:
    node_dir: "{{ inventory_dir }}/proxmox"
    # The puller, not a source: no inbound syncoid key here. On this host it
    # would also land in pmxcfs and fail the play.
    sanoid_pulled_remotely: false

  tasks:
    - name: iSCSI target tooling (targetcli-fb)
      tags: [package, never]
      ansible.builtin.apt:
        name: targetcli-fb
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Wireguard
      tags: [wireguard, never]
      ansible.builtin.import_tasks: ../common/tasks/wireguard.yml

    - name: Sanoid / Syncoid ZFS snapshots and backup
      tags: [sanoid, never]
      block:
        - name: Snapshot policy
          ansible.builtin.import_tasks: ../common/tasks/sanoid.yml

        - name: Upload csi-snapshot-unflag post-snapshot hook
          ansible.builtin.copy:
            src: "{{ node_dir }}/sanoid/csi-snapshot-unflag"
            dest: /usr/local/bin/csi-snapshot-unflag
            owner: root
            group: root
            mode: '0755'

        # The private half. In sops rather than generated here so each source
        # node can authorize the public half without proxmox being reachable.
        # Loaded into syncoid_secrets by the shared task above.
        - name: Ensure /etc/syncoid exists
          ansible.builtin.file:
            path: /etc/syncoid
            state: directory
            owner: root
            group: root
            mode: '0700'

        - name: Install the key proxmox authenticates to scw with
          # Block scalar + trim: openssh rejects a key with no trailing
          # newline, or with a blank line at the end.
          ansible.builtin.copy:
            content: |
              {{ syncoid_secrets.SYNCOID_PRIVATE_KEY | trim }}
            dest: /etc/syncoid/id_scw
            owner: root
            group: root
            mode: '0600'
          no_log: true

        - name: Upload the syncoid units
          # One pair per job: nvme -> backup locally, scw:zdata -> backup over wg.
          ansible.builtin.copy:
            src: "{{ node_dir }}/sanoid/{{ item }}"
            dest: "/etc/systemd/system/{{ item }}"
            owner: root
            group: root
            mode: '0644'
          loop:
            - syncoid-backup.service
            - syncoid-backup.timer
            - syncoid-scw.service
            - syncoid-scw.timer
          notify: daemon-reload

        - name: Enable the syncoid timers
          # daemon_reload here, not via the handler: that runs at the end of the
          # play, and systemd must read the units before it can enable them.
          ansible.builtin.systemd:
            name: "{{ item }}"
            enabled: true
            state: started
            daemon_reload: true
          loop:
            - syncoid-backup.timer
            - syncoid-scw.timer
          # Under --check the units were never written, so there is no timer
          # to find.
          when: not ansible_check_mode

  handlers:
    - name: daemon-reload
      ansible.builtin.systemd:
        daemon_reload: true
