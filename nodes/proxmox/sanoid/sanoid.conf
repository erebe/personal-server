[nvme]
	use_template = production
	recursive = yes

# The democratic-csi volumes. Same snapshot policy as the rest of nvme, but the
# post-snapshot hook strips the inherited democratic-csi:managed_resource flag -
# without it the driver can never delete one of these volumes. See the script.
[nvme/k8s-test]
	use_template = production
	recursive = yes
	post_snapshot_script = /usr/local/bin/csi-snapshot-unflag
	script_timeout = 60

# --- the backup pool ---------------------------------------------------------
#
# Nothing under backup/ had a section until now, and a dataset sanoid has no
# section for is a dataset sanoid does not touch - so `autoprune` never applied
# here. The replication target had 3359 snapshots against the source's 80, the
# oldest dating to 2026-04-27: every snapshot ever taken, because syncoid sends
# every intermediate and deletes nothing at the far end.

# The syncoid target for nvme.
#
# `autosnap = no` is a requirement, not tidiness. A snapshot taken locally here
# would become the newest snapshot on the dataset, the next incremental send
# would no longer line up with it, and syncoid would have to roll the target
# back before it could receive anything. Pruning is the only thing this section
# is here to do; the snapshots themselves all arrive from nvme.
#
# Pruning out from under syncoid is safe: only the newest common snapshot
# serves as the incremental base, and no count-based policy removes the newest.
# sanoid also defers rather than fighting a transfer in progress -
#   INFO: deferring pruning of <snap> - <path> is currently in zfs send or receive
[backup/nvme-backup]
	use_template = replica
	# Covers backup/nvme-backup/k8s, which had 2851 snapshots of its own.
	recursive = yes

# The syncoid target for scw's zdata - the ZFS mirror behind the cluster's
# observability volumes (Prometheus TSDB, Loki chunks, Grafana's sqlite). It is
# *pulled* from here by syncoid-scw.timer at 03:00 rather than pushed by scw:
# the credential then lives on the machine that holds the backups, so a
# compromised scw cannot reach into this pool and destroy its own history.
#
# `autosnap = no` for the same reason as nvme-backup above - a local snapshot
# would become the newest one and force syncoid to roll the target back.
#
# The replica template's hourly = 0 prunes the 36 hourlies scw takes, as they
# arrive. That is deliberate, but it is also what sets the width of the
# replication window: syncoid resumes from the newest snapshot common to both
# sides, which after pruning is a daily, and scw keeps 7 of those. A pull that
# fails for more than a week outlives every daily on both ends at once and the
# only way back is a full send. Nothing here notices that - see the same gap on
# syncoid-backup.
[backup/scw-backup]
	use_template = replica
	# Nothing under zdata today either (local-hostpath provisions directories,
	# not datasets), so this only matters the day one appears on the source.
	recursive = yes

# 1.59T - the largest thing on this host - and until recently not one snapshot:
# no protection against a delete or an overwrite, and no history, only the
# mirror underneath it. Nothing replicates it either, so what is configured here
# is the entire protection this dataset has.
#
# Its own template rather than production's numbers with the hourlies switched
# off: production is tuned for a dataset whose depth lives on a replica, and
# this one has no replica. Files are also the data class where a loss surfaces
# late - somebody notices in November that a folder looks thin - which is worth
# far more here than hourly recall of an archive nobody wrote to.
[backup/data]
	use_template = archive

# Allow to go back
# hourly 36 -> 1,5 days ago at 1 hour granularity
# daily 7 -> 7 days at the day granularity
[template_production]
	frequently = 0
	hourly = 36
	daily = 7
	weekly = 0
	monthly = 0
	yearly = 0
	autosnap = yes
	autoprune = yes

# Allow to go back
# daily 90 -> 3 months at the day granularity
# syncoid run once every day so hourly is meaningless here
[template_replica]
	frequently = 0
	hourly = 0
	daily = 90
	weekly = 0
	monthly = 0
	yearly = 0
	# See the note on backup/nvme-backup above.
	autosnap = no
	autoprune = yes

# For the file archive, which has no replica behind it: daily granularity and a
# year of reach for 50 markers. No hourlies - an archive that is written to
# occasionally does not need them, and they would be the only tier holding
# blocks for churn that does not happen. Raise `yearly` if a year stops being
# far enough.
[template_archive]
	frequently = 0
	hourly = 0
	daily = 30
	weekly = 8
	monthly = 12
	yearly = 0
	autosnap = yes
	autoprune = yes
