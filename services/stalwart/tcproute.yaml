apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: email-smtp
spec:
  parentRefs:
    - name: envoy
      sectionName: smtp25-listener
    - name: envoy
      sectionName: smtp587-listener
  rules:
    - backendRefs:
        - name: email
          port: 25
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: email-smtp
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: TCPRoute
      name: email-smtp
  proxyProtocol:
    version: V2
---
# Implicit TLS: unlike 25/587 this listener must reach stalwart's own 465
# listener, so it cannot share the email-smtp route's :25 backend.
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: email-smtp-465
spec:
  parentRefs:
    - name: envoy
      sectionName: smtp465-listener
  rules:
    - backendRefs:
        - name: email
          port: 465
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: email-smtp-465
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: TCPRoute
      name: email-smtp-465
  proxyProtocol:
    version: V2
