apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Every node in this cluster carries kubernetes.io/hostname=<name>:NoSchedule,
# so anything pinned to a node needs the matching toleration as well as the
# affinity. The two always travel together, and this is the toleration half.
#
# Deliberately no `effect`: a toleration without one matches every effect for
# that key/value, which is what the deployments that used to carry this inline
# already did. Adding effect: NoSchedule here would silently narrow them.
#
# Services needing more than this - node-failure tolerations, a different
# effect - keep their own inline list instead; see the README.
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: kubernetes.io/hostname
            operator: Equal
            value: server
