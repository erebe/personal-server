; Mounted into /config/php, which is PHP's additional-ini scan directory in the
; linuxserver image. Files there load in alphabetical order, so the `zz-` name
; this is mounted under puts it after the php-local.ini the image seeds on first
; run - and that file contains, verbatim:
;
;   date.timezone =
;
; An empty value is not a valid timezone, so PHP warns once per startup and
; falls back to UTC. With the 5-minute cron that is ~290 lines a day of:
;
;   PHP Warning:  PHP Startup: Invalid date.timezone value '', using 'UTC'
;   instead in Unknown on line 0
;
; Setting it here to the value PHP already falls back to silences the warning
; and moves no timestamp. Switch to Europe/Paris if you would rather PHP's own
; dates were local - Nextcloud renders per-user timezones itself, so this
; mostly affects logs and internals.
date.timezone = UTC
