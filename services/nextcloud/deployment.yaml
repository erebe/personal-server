apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {}
  template:
    metadata: {}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
      - name: nextcloud
        # Bump one major at a time: the image's init sleeps forever instead of
        # starting when the data is more than one major behind it.
        image: linuxserver/nextcloud:35.0.2-ls460
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
        volumeMounts:
        # Over the live file, not /defaults: the image copies its sample only
        # when default.conf is missing, so edits there never reached nginx.
        - name: nginx-siteconfig
          mountPath: /config/nginx/site-confs/default.conf
          subPath: default.conf.sample
        - name: data-nvme
          subPath: config
          mountPath: /config
        - name: data-nvme
          subPath: data
          mountPath: /data
        - name: data-hdd
          subPath: photos
          mountPath: /data/cecile/files/photos
        - name: preview
          mountPath: /data/appdata_ocxf7jgp27m7/preview
        # A single-file subPath mount nested inside the /config PVC: it adds
        # this one file to /config/php without shadowing php-local.ini or
        # www2.conf, which the image seeds there and expects to keep.
        - name: php-config
          mountPath: /config/php/zz-timezone.ini
          subPath: zz-timezone.ini
      volumes:
      - name: nginx-siteconfig
        configMap:
          name: nextcloud-nginx-siteconfig
      - name: php-config
        configMap:
          name: nextcloud-php-config
      - name: preview
        hostPath:
          path: /opt/nextcloud/preview
          type: Directory
      - name: data-nvme
        persistentVolumeClaim:
          claimName: nextcloud-pv-claim
      - name: data-hdd
        persistentVolumeClaim:
          claimName: nextcloud-hdd-pv-claim
