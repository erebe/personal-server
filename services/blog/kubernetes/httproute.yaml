apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blog
spec:
  parentRefs:
    - name: envoy
  # One hostname per directory inside public/, the first label selecting the directory to serve,
  # plus fork.*, whose short links the server answers with a redirect
  hostnames:
    - wstunnel.erebe.eu
    - wstunnel.erebe.dev
    - cv.erebe.eu
    - cv.erebe.dev
    - blog.erebe.eu
    - blog.erebe.dev
    - fork.erebe.eu
    - fork.erebe.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: blog
          port: 8087
